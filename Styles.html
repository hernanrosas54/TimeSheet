<style>
  :root {
    --brand: #2563eb;
    --ink: #0f172a;
  }

  html,
  body {
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  /* ------------------------------------------------ Tarjetas y formularios */
  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 1rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #475569;
    margin-bottom: 0.35rem;
  }

  .input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 0.65rem;
    padding: 0.55rem 0.75rem;
    font-size: 0.95rem;
    line-height: 1.4;
    background: #ffffff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .input:disabled,
  .input[readonly] {
    background: #f1f5f9;
    color: #64748b;
  }

  .input.is-invalid {
    border-color: #e11d48;
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
  }

  .hint {
    margin-top: 0.35rem;
    font-size: 0.78rem;
    color: #64748b;
    min-height: 1rem;
  }

  /* ------------------------------------------------ Botones */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    border-radius: 0.65rem;
    font-weight: 600;
    font-size: 0.875rem;
    padding: 0.55rem 0.95rem;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--brand);
    color: #ffffff;
  }

  .btn-primary:hover:not(:disabled) {
    background: #1d4ed8;
  }

  .btn-ghost {
    background: #ffffff;
    border-color: #cbd5e1;
    color: #334155;
  }

  .btn-ghost:hover:not(:disabled) {
    background: #f8fafc;
  }

  .btn-danger {
    background: #fff1f2;
    border-color: #fecdd3;
    color: #be123c;
  }

  .btn-danger:hover:not(:disabled) {
    background: #ffe4e6;
  }

  .btn-sm {
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
    border-radius: 0.5rem;
  }

  /* Botón compacto de sólo icono (acciones dentro de las listas). */
  .btn-icon {
    width: 2rem;
    height: 2rem;
    padding: 0;
    gap: 0;
    font-size: 1rem;
    line-height: 1;
    border-radius: 0.5rem;
    flex: none;
  }

  /* ------------------------------------------------ Pestañas */
  .tabs {
    display: flex;
    gap: 0.25rem;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar {
    display: none;
  }

  .tab {
    border-radius: 0.6rem;
    padding: 0.45rem 0.8rem;
    font-size: 0.83rem;
    font-weight: 600;
    color: #475569;
    white-space: nowrap;
    border: 1px solid transparent;
    cursor: pointer;
  }

  .tab:hover {
    background: #f1f5f9;
  }

  .tab.is-active {
    background: #0f172a;
    color: #ffffff;
  }

  /* ------------------------------------------------ Autocompletado */
  .combo-list {
    position: absolute;
    z-index: 40;
    left: 0;
    right: 0;
    margin-top: 0.35rem;
    max-height: 16rem;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 0.75rem;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16);
    padding: 0.25rem;
  }

  .combo-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.6rem;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    color: #1e293b;
    cursor: pointer;
  }

  .combo-item.is-active,
  .combo-item:hover {
    background: #eff6ff;
  }

  .combo-item .combo-meta {
    margin-left: auto;
    font-size: 0.72rem;
    color: #64748b;
    text-align: right;
  }

  .combo-empty {
    padding: 0.6rem;
    font-size: 0.82rem;
    color: #94a3b8;
    text-align: center;
  }

  /* ------------------------------------------------ Etiquetas y tablas */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
    font-size: 0.72rem;
    font-weight: 600;
    background: #f1f5f9;
    color: #475569;
  }

  .badge-ok {
    background: #dcfce7;
    color: #15803d;
  }

  .badge-off {
    background: #fef3c7;
    color: #b45309;
  }

  .table-wrap {
    overflow: auto;
    max-height: 65vh;
  }

  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  table.data thead th {
    position: sticky;
    top: 0;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
    padding: 0.55rem 0.7rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #475569;
    z-index: 1;
  }

  table.data tbody td {
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: top;
    color: #1e293b;
  }

  table.data tbody tr:hover {
    background: #f8fafc;
  }

  .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .truncate-cell {
    max-width: 22rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Enlace de edición en la primera columna de las tablas */
  .link-cell {
    color: var(--brand);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dashed rgba(37, 99, 235, 0.45);
  }

  .link-cell:hover,
  .link-cell:focus {
    color: #1d4ed8;
    border-bottom-color: #1d4ed8;
    outline: none;
  }

  /* Encabezados de columnas calculadas: se ordenan al hacer clic */
  .th-num {
    text-align: right;
  }

  .th-sort {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  .th-sort:hover,
  .th-sort:focus,
  .th-sort.is-active {
    color: var(--brand);
    outline: none;
  }

  .th-sort-arrow {
    font-size: 0.7rem;
    opacity: 0.5;
  }

  .th-sort.is-active .th-sort-arrow {
    opacity: 1;
  }

  /* ------------------------------------------------ Modales y avisos */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }

  @media (min-width: 640px) {
    .modal-backdrop {
      align-items: center;
      padding: 1.5rem;
    }
  }

  .modal-panel {
    background: #ffffff;
    width: 100%;
    max-width: 42rem;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 1rem 1rem 0 0;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
  }

  @media (min-width: 640px) {
    .modal-panel {
      border-radius: 1rem;
    }
  }

  /* Panel ancho para tablas de detalle (drill down de proyectos). */
  .modal-panel.modal-wide {
    max-width: 72rem;
  }

  /* Separador de mes en el detalle de un proyecto */
  tr.detail-month td {
    background: #eef2ff;
    border-top: 1px solid #c7d2fe;
    border-bottom: 1px solid #c7d2fe;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #3730a3;
    padding: 0.4rem 0.7rem;
  }

  tr.detail-month:first-child td {
    border-top: 0;
  }

  .detail-month-meta {
    margin-left: 0.6rem;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    color: #64748b;
  }

  .toast {
    pointer-events: auto;
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    min-width: 16rem;
    max-width: 24rem;
    padding: 0.7rem 0.85rem;
    border-radius: 0.75rem;
    color: #ffffff;
    font-size: 0.85rem;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
    animation: toast-in 0.18s ease-out;
  }

  .toast-success { background: #15803d; }
  .toast-error { background: #be123c; }
  .toast-info { background: #1e293b; }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .spinner {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 999px;
    border: 3px solid #cbd5e1;
    border-top-color: var(--brand);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .fade-in {
    animation: fade-in 0.2s ease-out;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>

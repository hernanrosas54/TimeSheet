<script>
/**
 * Pantalla de registro de tiempos.
 */
window.TimePage = (function () {
  const state = {
    projectCombo: null,
    typeCombo: null,
    project: null,
    tipo: '',
    bound: false,
    saving: false,
    editing: null,
    day: { entries: [], totalMinutos: 0, fecha: '' }
  };

  function roundStep() {
    return Number(Core.state.app.roundMinutes) || 10;
  }

  function el(id) {
    return document.getElementById(id);
  }

  function projectItems() {
    return (Core.state.projects || []).map(function (project) {
      const metaParts = [];
      if (project.cliente) metaParts.push(project.cliente);
      if (!project.activo) metaParts.push('inactivo');
      return {
        value: project.numero,
        label: project.numero + ' · ' + project.nombre,
        search: [project.numero, project.nombre, project.cliente].join(' '),
        meta: metaParts.join(' · '),
        activo: project.activo,
        cliente: project.cliente,
        nombre: project.nombre
      };
    });
  }

  function typeItems() {
    return (Core.state.activityTypes || []).map(function (tipo) {
      return { value: tipo, label: tipo, search: tipo };
    });
  }

  /* ------------------------------------------------------------ Arranque */
  function init() {
    if (state.bound) return;
    state.bound = true;

    state.projectCombo = Core.createCombobox({
      input: el('projectInput'),
      list: el('projectList'),
      emptyText: 'No hay proyectos que coincidan',
      onSelect: function (item) {
        state.project = item.value;
        renderProjectHint();
        updatePreview();
      },
      onClear: function () {
        state.project = null;
        renderProjectHint();
      }
    });

    state.typeCombo = Core.createCombobox({
      input: el('typeInput'),
      list: el('typeList'),
      emptyText: 'Tipo no encontrado',
      onSelect: function (item) {
        state.tipo = item.value;
        el('typeInput').classList.remove('is-invalid');
      },
      onClear: function () {
        state.tipo = '';
      }
    });

    el('projectClear').addEventListener('click', function () {
      state.projectCombo.clear();
      state.project = null;
      renderProjectHint();
      el('projectInput').focus();
    });

    el('btnStartNow').addEventListener('click', function () {
      const now = Core.currentRoundedTime(roundStep());
      el('startTime').value = now;
      el('startTime').classList.remove('is-invalid');
      updatePreview();
    });

    el('btnNow').addEventListener('click', function () {
      const now = Core.currentRoundedTime(roundStep());
      el('endTime').value = now;
      if (!el('startTime').value) el('startTime').value = now;
      updatePreview();
    });

    el('btnReset').addEventListener('click', function () {
      resetForm(true);
    });

    el('timeForm').addEventListener('submit', function (event) {
      event.preventDefault();
      save();
    });

    ['entryDate', 'startTime', 'endTime'].forEach(function (id) {
      el(id).addEventListener('change', function () {
        updatePreview();
        if (id === 'entryDate') loadDay();
      });
    });

    ['startTime', 'endTime'].forEach(function (id) {
      el(id).addEventListener('blur', function () {
        const rounded = Core.roundToStep(el(id).value, roundStep());
        if (rounded) el(id).value = rounded;
        updatePreview();
      });
    });

    el('activity').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        el('notes').focus();
      }
    });

    el('notes').addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        save();
      }
    });

    // Delegación: el botón «Copiar» de cada registro del día rellena el formulario.
    el('dayList').addEventListener('click', function (event) {
      const target = event.target && typeof event.target.closest === 'function' ? event.target : null;
      if (!target) return;

      const entries = (state.day && state.day.entries) || [];

      const copyButton = target.closest('[data-copy-entry]');
      if (copyButton) {
        const entry = entries[Number(copyButton.dataset.copyEntry)];
        if (entry) copyEntryToForm(entry);
        return;
      }

      const editButton = target.closest('[data-edit-entry]');
      if (editButton) {
        const entry = entries[Number(editButton.dataset.editEntry)];
        if (entry) editEntryToForm(entry);
      }
    });

    // El aviso de edición es opcional: si el HTML servido viene de otra versión
    // (sin #btnCancelEdit), la aplicación debe arrancar igual en vez de fallar.
    const cancelButton = el('btnCancelEdit');
    if (cancelButton) cancelButton.addEventListener('click', cancelEdit);
  }

  /* ------------------------------------------------------------ Carga de datos */
  function refresh() {
    state.projectCombo.setItems(projectItems());
    state.typeCombo.setItems(typeItems());

    const tipos = Core.state.activityTypes || [];
    el('typeHint').textContent = tipos.length
      ? tipos.length + ' tipos disponibles · escribe para filtrar (no distingue acentos).'
      : 'No hay tipos de actividad registrados. Agrégalos en la pestaña Tipos de actividad.';

    const fechaInput = el('entryDate');
    if (!fechaInput.value) {
      fechaInput.value = Core.state.defaults.fecha || Core.todayIso();
    }

    const startInput = el('startTime');
    if (!startInput.value) {
      startInput.value = Core.state.defaults.horaInicio || Core.currentRoundedTime(roundStep());
    }

    if (!el('endTime').value) {
      el('endTime').value = '';
    }

    updatePreview();
    loadDay();
  }

  function renderProjectHint() {
    const hint = el('projectHint');
    const input = el('projectInput');
    const clearButton = el('projectClear');

    if (!state.project) {
      hint.textContent = 'Escribe el número o el nombre del proyecto y elige una opción.';
      hint.className = 'hint';
      clearButton.classList.add('hidden');
      return;
    }

    const selected = (Core.state.projects || []).filter(function (project) {
      return Core.normalize(project.numero) === Core.normalize(state.project);
    })[0];

    if (!selected) {
      hint.textContent = 'Proyecto no encontrado en la lista.';
      hint.className = 'hint text-rose-600';
      clearButton.classList.add('hidden');
      return;
    }

    const parts = [selected.cliente ? 'Cliente: ' + selected.cliente : 'Sin cliente asociado'];
    if (!selected.activo) parts.push('proyecto inactivo');
    hint.textContent = parts.join(' · ');
    hint.className = selected.activo ? 'hint' : 'hint text-amber-600';
    clearButton.classList.remove('hidden');
  }

  /* ------------------------------------------------------------ Resumen del día */
  async function loadDay() {
    const fecha = el('entryDate').value || Core.todayIso();
    try {
      const day = await Core.call('apiDayEntries', fecha);
      state.day = day;
      renderDay(day);
    } catch (error) {
      Core.toast(error.message, 'error');
    }
  }

  /** Registros ordenados por hora de inicio descendente (el más reciente primero). */
  function sortEntriesDesc(entries) {
    return (entries || []).slice().sort(function (a, b) {
      const inicio = Core.timeToMinutes(b.horaInicio) - Core.timeToMinutes(a.horaInicio);
      if (inicio) return inicio;
      const fin = Core.timeToMinutes(b.horaFin) - Core.timeToMinutes(a.horaFin);
      if (fin) return fin;
      return (Number(b._row) || 0) - (Number(a._row) || 0);
    });
  }

  /**
   * Copia al formulario el proyecto, el tipo de actividad y la actividad de un
   * registro del día. La fecha y las horas no se tocan: se conservan las que ya
   * hubiera para poder continuar justo donde se quedó.
   */
  function copyEntryToForm(entry) {
    if (!entry) return;

    // Copiar siempre prepara un registro nuevo: se abandona cualquier edición.
    clearEditing();

    const project = state.projectCombo.setSelectedByValue(entry.proyecto);
    if (!project) {
      // El proyecto ya no está en la lista: se deja el número visible y marcado
      // como inválido para que no se guarde por error con otro proyecto.
      el('projectInput').value = entry.proyecto || '';
      el('projectInput').classList.add('is-invalid');
      state.project = null;
    }
    renderProjectHint();

    const tipo = state.typeCombo.setSelectedByValue(entry.tipoActividad);
    if (!tipo) {
      el('typeInput').value = entry.tipoActividad || '';
      el('typeInput').classList.add('is-invalid');
      state.tipo = '';
    }

    el('activity').value = entry.actividad || '';
    el('activity').classList.remove('is-invalid');

    updatePreview();
    el('activity').focus();

    if (project && tipo) {
      Core.toast('Copiado al formulario: ' + entry.proyecto + ' · ' + entry.tipoActividad, 'success');
      return;
    }

    Core.toast('Copiado, pero ' + (!project ? 'el proyecto' : 'el tipo de actividad') +
      ' ya no está en la lista. Elige uno válido antes de guardar.', 'error', 6000);
  }

  /* ------------------------------------------------------------ Edición */
  /**
   * Carga en el formulario un registro del día para corregirlo: proyecto, tipo
   * de actividad, actividad, observaciones, fecha y horas. El botón de guardado
   * pasa a «Guardar cambios» y el envío incluye "_row" para actualizar la fila.
   */
  function editEntryToForm(entry) {
    if (!entry) return;

    const project = state.projectCombo.setSelectedByValue(entry.proyecto);
    if (!project) {
      // El proyecto ya no está en la lista: se deja el número visible y marcado
      // como inválido para que no se guarde por error con otro proyecto.
      el('projectInput').value = entry.proyecto || '';
      el('projectInput').classList.add('is-invalid');
      state.project = null;
    }
    renderProjectHint();

    const tipo = state.typeCombo.setSelectedByValue(entry.tipoActividad);
    if (!tipo) {
      el('typeInput').value = entry.tipoActividad || '';
      el('typeInput').classList.add('is-invalid');
      state.tipo = '';
    }

    el('activity').value = entry.actividad || '';
    el('activity').classList.remove('is-invalid');
    el('notes').value = entry.observaciones || '';
    el('entryDate').value = entry.fecha || el('entryDate').value;
    el('startTime').value = entry.horaInicio || '';
    el('endTime').value = entry.horaFin || '';

    state.editing = {
      row: Number(entry._row) || 0,
      proyecto: entry.proyecto || '',
      fecha: entry.fecha || el('entryDate').value
    };

    showEditBanner(entry);
    showError('');
    updatePreview();
    renderDay(state.day);
    el('activity').focus();

    // Si el registro es de otra fecha, se recarga el panel de ese día.
    if (state.day && state.day.fecha && state.day.fecha !== state.editing.fecha) loadDay();

    if (project && tipo) {
      Core.toast('Editando el registro ' + entry.horaInicio + ' – ' + entry.horaFin + '.', 'info');
      return;
    }

    Core.toast('Registro cargado, pero ' + (!project ? 'el proyecto' : 'el tipo de actividad') +
      ' ya no está en la lista. Elige uno válido antes de guardar.', 'error', 6000);
  }

  /** Muestra el aviso de edición y cambia el texto del botón de guardado. */
  function showEditBanner(entry) {
    const banner = el('editBanner');
    const text = el('editBannerText');

    if (text) {
      text.textContent = 'Editando ' + entry.horaInicio + ' – ' + entry.horaFin + ' · ' +
        entry.proyecto + ' · ' + entry.tipoActividad;
    }

    if (banner) banner.classList.remove('hidden');

    const saveButton = el('btnSave');
    if (saveButton) saveButton.textContent = 'Guardar cambios';
  }

  /** Sale del modo edición sin tocar lo que haya en el formulario. */
  function clearEditing() {
    state.editing = null;

    const banner = el('editBanner');
    if (banner) banner.classList.add('hidden');

    const saveButton = el('btnSave');
    if (saveButton) saveButton.textContent = 'Guardar registro';
  }

  /** Descarta la edición en curso y deja el formulario listo para un alta. */
  function cancelEdit() {
    if (!state.editing) return;
    clearEditing();
    Core.toast('Edición cancelada; no se guardó ningún cambio.', 'info');
    resetForm(true);
  }

  function renderDay(day) {
    const list = el('dayList');
    const total = el('dayTotal');
    const dateLabel = el('dayDate');
    const empty = el('dayEmpty');

    // Se guarda ya ordenado para que el índice del botón «Copiar» apunte al registro.
    const entries = sortEntriesDesc((day && day.entries) || []);
    state.day = {
      fecha: (day && day.fecha) || el('entryDate').value,
      totalMinutos: (day && day.totalMinutos) || 0,
      entries: entries
    };

    total.textContent = Core.formatMinutes(state.day.totalMinutos);
    total.className = 'badge' + (entries.length ? ' badge-ok' : '');
    dateLabel.textContent = Core.formatDateLong(state.day.fecha) +
      (entries.length ? ' · ' + entries.length + ' registro' + (entries.length === 1 ? '' : 's') : '');

    if (!entries.length) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }

    empty.classList.add('hidden');
    list.innerHTML = entries.map(function (entry, index) {
      const titulo = entry.proyecto + ' · ' + (entry.proyectoNombre || 'Proyecto');
      const resumen = entry.tipoActividad + ' · ' + entry.actividad;
      const enEdicion = !!state.editing && Number(state.editing.row) === Number(entry._row);
      return '<li class="rounded-lg border px-3 py-2 ' +
          (enEdicion ? 'border-amber-300 bg-amber-50' : 'border-slate-200') + '">' +
        // Cabecera: horas y duración a la izquierda, acciones compactas a la derecha.
        '<div class="flex items-center justify-between gap-2">' +
          '<div class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1">' +
            '<span class="whitespace-nowrap text-xs font-semibold text-slate-700">' +
              Core.escapeHtml(entry.horaInicio) + ' – ' + Core.escapeHtml(entry.horaFin) + '</span>' +
            '<span class="badge whitespace-nowrap">' + Core.formatMinutes(entry.minutos) + '</span>' +
          '</div>' +
          '<div class="flex shrink-0 items-center gap-1">' +
          '<button type="button" class="btn btn-ghost btn-icon" data-copy-entry="' + index + '"' +
            ' title="Copiar al formulario: ' + Core.escapeHtml(resumen) + '"' +
            ' aria-label="Copiar ' + Core.escapeHtml(titulo) + ' al formulario">' +
            '<span aria-hidden="true">⧉</span>' +
          '</button>' +
          '<button type="button" class="btn btn-ghost btn-icon" data-edit-entry="' + index + '"' +
            ' title="Editar este registro: ' + Core.escapeHtml(resumen) + '"' +
            ' aria-label="Editar ' + Core.escapeHtml(titulo) + '">' +
            '<span aria-hidden="true">✎</span>' +
          '</button>' +
          '</div>' +
        '</div>' +
        // Proyecto y actividad usan todo el ancho de la tarjeta y hacen salto de línea.
        '<p class="mt-1.5 break-words text-xs font-medium leading-snug text-slate-700">' +
          Core.escapeHtml(titulo) + '</p>' +
        '<p class="break-words text-xs leading-snug text-slate-500">' + Core.escapeHtml(resumen) + '</p>' +
        '</li>';
    }).join('');
  }

  /* ------------------------------------------------------------ Vista previa */
  function updatePreview() {
    const badge = el('durationPreview');
    const warning = el('dateWarning');
    const start = el('startTime').value;
    const end = el('endTime').value || Core.currentRoundedTime(roundStep());

    if (!start || !end) {
      badge.textContent = '—';
      badge.className = 'badge';
      return;
    }

    const minutes = Core.timeToMinutes(end) - Core.timeToMinutes(start);
    if (minutes <= 0) {
      badge.textContent = 'La hora fin debe ser mayor';
      badge.className = 'badge badge-off';
    } else {
      badge.textContent = Core.formatMinutes(minutes) + ' (' + start + ' → ' + end + ')';
      badge.className = 'badge badge-ok';
    }

    const today = Core.todayIso();
    warning.classList.toggle('hidden', el('entryDate').value === today);
  }

  /* ------------------------------------------------------------ Guardar */
  function showError(message) {
    const box = el('formError');
    if (!message) {
      box.textContent = '';
      box.classList.add('hidden');
      return;
    }
    box.textContent = message;
    box.classList.remove('hidden');
  }

  function collect() {
    const project = state.projectCombo.resolve();
    const type = state.typeCombo.resolve();
    const fecha = el('entryDate').value;
    const inicio = Core.roundToStep(el('startTime').value, roundStep());
    const finRaw = el('endTime').value;
    const actividad = el('activity').value.trim();

    el('projectInput').classList.toggle('is-invalid', !project);
    el('typeInput').classList.toggle('is-invalid', !type);

    if (!project) throw new Error('Selecciona un proyecto de la lista.');
    const mantieneProyectoEditado = !!state.editing &&
      Core.normalize(project.value) === Core.normalize(state.editing.proyecto);
    if (project.activo === false && !mantieneProyectoEditado) {
      throw new Error('El proyecto ' + project.value + ' está inactivo. Elige un proyecto activo.');
    }
    if (!type) throw new Error('Selecciona un tipo de actividad de la lista.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) throw new Error('Selecciona una fecha válida.');
    if (!inicio) throw new Error('Indica la hora de inicio.');
    if (finRaw && Core.timeToMinutes(finRaw) <= Core.timeToMinutes(inicio)) {
      throw new Error('La hora de finalización debe ser mayor que la hora de inicio (' + inicio + ').');
    }
    if (!actividad) throw new Error('Escribe la actividad realizada.');

    const data = {
      proyecto: project.value,
      tipoActividad: type.value,
      actividad: actividad,
      observaciones: el('notes').value.trim(),
      fecha: fecha,
      horaInicio: inicio,
      horaFin: finRaw ? Core.roundToStep(finRaw, roundStep()) : ''
    };

    // Al corregir un registro se envía la fila para que el servidor la actualice.
    if (state.editing && Number(state.editing.row) > 0) data._row = Number(state.editing.row);

    return data;
  }

  async function save() {
    if (state.saving) return;

    showError('');

    let payload;
    try {
      payload = collect();
    } catch (error) {
      showError(error.message);
      return;
    }

    const button = el('btnSave');
    const editando = !!state.editing;
    const filaEditada = Number(payload._row) || 0;
    let edicionGuardada = false;
    state.saving = true;
    Core.setBusy(button, true, 'Guardando…');

    try {
      const result = await Core.call('apiSaveTimeEntry', payload);
      edicionGuardada = true;
      const saved = result.entry;

      Core.toast((editando ? 'Actualizado: ' : 'Guardado: ') + saved.proyecto + ' · ' + Core.formatMinutes(saved.minutos), 'success');

      // El servidor confirma con "updated" cuando corrigió la fila enviada. Si se
      // envió "_row" y la respuesta no lo confirma, la copia desplegada de Api.gs
      // es anterior al modo edición: agregó una fila nueva en lugar de corregirla.
      if (filaEditada && result.updated !== true) {
        Core.toast('Se agregó un registro nuevo en lugar de corregir el de las ' +
          payload.horaInicio + '.\nLa copia desplegada de Api.gs no aplica la corrección por "_row": ' +
          'sube el proyecto completo al editor de Apps Script y vuelve a intentarlo.', 'error', 15000);
      }

      // Preparar el siguiente registro: la hora fin pasa a ser la hora inicio.
      el('startTime').value = saved.horaFin;
      el('endTime').value = '';
      el('activity').value = '';
      el('notes').value = '';
      el('entryDate').value = saved.fecha;

      if (result.dayEntries) {
        state.day = result.dayEntries;
        renderDay(result.dayEntries);
      } else {
        loadDay();
      }

      updatePreview();
      el('activity').focus();
    } catch (error) {
      showError(error.message);
      Core.toast(error.message, 'error');
    } finally {
      state.saving = false;
      Core.setBusy(button, false);
      // setBusy restaura la etiqueta que tenía el botón; si la edición se
      // guardó, después se vuelve a «Guardar registro».
      if (edicionGuardada) clearEditing();
    }
  }

  function resetForm(clearTimes) {
    clearEditing();
    state.projectCombo.clear();
    state.project = null;
    state.typeCombo.clear();
    state.tipo = '';
    el('activity').value = '';
    el('notes').value = '';
    el('activity').classList.remove('is-invalid');
    el('entryDate').value = Core.state.defaults.fecha || Core.todayIso();

    if (clearTimes) {
      el('startTime').value = Core.currentRoundedTime(roundStep());
      el('endTime').value = '';
    }

    renderProjectHint();
    showError('');
    updatePreview();
    loadDay();
    el('projectInput').focus();
  }

  return {
    init: init,
    refresh: refresh,
    updatePreview: updatePreview,
    loadDay: loadDay,
    save: save,
    editEntryToForm: editEntryToForm,
    cancelEdit: cancelEdit,
    resetForm: resetForm,
    state: state
  };
})();
</script>
